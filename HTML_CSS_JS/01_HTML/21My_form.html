<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>

    <!--
        =====================================================
        회원가입 폼 페이지 실습
        =====================================================
        회원가입 폼 페이지를 만들어본다.
    -->

    <style>

        * { box-sizing: border-box; }

        a {
            text-decoration: none; /* 링크 기본 밑줄 제거 */
            color: black;        /* 링크 기본 파란색 제거 */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4; /* 폼이 떠 보이도록 배경에 연한 회색 적용 */
        }

    </style>
</head>
<body>

    <form action="/test.jsp" method="get">

        <div>
            <h2>정보입력</h2>
        </div>
        <hr/>
        <div>
            <h3>회원 정보 입력</h3>
        </div>
        <hr/>

        <div>
            <!-- 
                === 이름 ===
                hint: 입력 규칙 안내 문구.
            -->
            <div class="row">
                <label>이름</label>
                <input type="text" name="name" />
            </div>
            <span class="hint">* 한글은 10자, 영문은 20자 이내로 입력해 주세요</span>

            <!-- 
                === 아이디 ===
                href="javascript:void(0)": 페이지 이동 없이 클릭 이벤트만 발생시키는 더미 링크
            -->
            <div class="row">
                <label>아이디</label>
                <input type="text" name="userid" />
                <a class="btn" href="javascript:void(0)">중복확인</a>
            </div>
            <span class="hint">* 6자리 이상의 영문 혹은 영문, 숫자를 조합하여 입력해 주세요</span>

            <!-- === 비밀번호 === -->
            <div class="row">
                <label>비밀번호</label>
                <input type="password" name="password" />
            </div>
            <span class="hint">* 영문, 대소문자, 숫자, 특수문자 중 3개 이상을 조합하여 8자리 이상 입력해 주세요</span>

            <div class="row">
                <label>비밀번호 확인</label>
                <input type="password" name="re-password" />
            </div>

            <!-- 
                === 이메일 ===
                아이디 직접 입력 + 도메인 select 조합
            -->
            <div class="row">
                <label>이메일</label>
                <input type="text" name="mail" />
                <select>
                    <option value="" selected>@naver.com</option>
                    <option value="">@gmail.com</option>
                    <option value="">@hotmail.com</option>
                    <option value="">@hanmail.net</option>
                    <option value="">@daum.net</option>
                    <option value="">@nate.com</option>
                </select>
                <a class="btn" href="javascript:void(0)">중복확인</a>
            </div>

            <!-- === 생년월일 === -->
            <div class="row">
                <label>생년월일</label>
                <input type="text" name="birth" placeholder="예: 20001021" />
            </div>

            <!-- 
                === 성별 ===
                radio: 같은 name으로 묶어 하나만 선택 가능
            -->
            <div class="row">
                <label>성별</label>
                <input type="radio" name="gender" /> 남성
                <input type="radio" name="gender" /> 여성
            </div>

            <!-- 
                === 휴대폰번호 ===
                select로 앞자리 선택 + input 2개로 나머지 번호 분할 입력
            -->
            <div class="row">
                <label>휴대폰번호</label>
                <select>
                    <option value="" selected>010</option>
                    <option value="">011</option>
                    <option value="">016</option>
                </select>
                <input type="text" name="phone" />
                <input type="text" name="phone" />
                <a class="btn" href="javascript:void(0)">인증전송</a>
            </div>

            <hr/>

            <!-- 
                === 회원가입/취소 버튼 ===
                input type="submit": form 데이터를 전송하는 입력 타입
            -->
            <div class="row submit-row">
                <input class="btn btn-cancel" type="submit" value="취소" />
                <input class="btn btn-submit" type="submit" value="회원가입" />
            </div>
        </div>

    </form>

</body>
</html>
