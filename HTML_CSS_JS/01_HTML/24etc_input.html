<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--
        =====================================================
        input type 종류 
        =====================================================
        text / search / url / date / time / datetime-local / number 등
        input 태그의 type 속성 실습
    -->

</head>
<body>
    <form action="/text.jsp">
        <!--
            === input type 속성 종류 ===
            type 속성에 따라 브라우저가 제공하는 입력 UI와 유효성 검사 방식이 달라진다.
        -->
        <div>
            <label for="">TEXT</label>
            <!-- type="text": 일반 텍스트 입력 필드 (기본값) -->
            <input type="text">
        </div>
        <div>
            <label for="">SEARCH</label>
            <!-- type="search": 검색어 입력 필드. text와 거의 동일하나 브라우저에 따라 X 버튼이 생긴다 -->
            <input type="search">
        </div>
        <div>
            <label for="">URL</label>
            <!-- type="url": URL 형식 입력 필드. 유효성 검증해 http:// 등 주소 형식이 아니면 submit을 막는다 -->
            <input type="url">
        </div>
        <div>
            <label for="">DATE</label>
            <!-- type="date": 날짜 선택 UI를 제공하는 필드. 값은 yyyy-mm-dd 형식으로 전송된다 -->
            <input type="date">
        </div>
        <div>
            <label for="">TIME</label>
            <!-- type="time": 시간 선택 UI를 제공하는 필드. 값은 hh:mm 형식으로 전송된다 -->
            <input type="time">
        </div>
        <div>
            <label for="">DATETIME</label>
            <!-- type="datetime-local": 날짜 + 시간을 함께 선택하는 필드. 시간대 정보는 포함되지 않는다 -->
            <input type="datetime-local">
        </div>
        <div>
            <label for="">NUMBER</label>
            <!-- type="number": 숫자만 입력 가능한 필드. 브라우저가 스핀 버튼(위아래 화살표)을 제공한다 -->
            <input type="number">
        </div>
    </form>
</body>
</html>
