<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--
        =====================================================
        input type 종류 
        =====================================================
        text / search / url / date / time / datetime-local / number 등
        input 태그의 type 속성 실습
    -->

</head>
<body>
    <form action="/text.jsp">
        <!--
            === input type 속성 종류 ===
            type 속성에 따라 브라우저가 제공하는 입력 UI와 유효성 검사 방식이 달라진다.
        -->
        <div>
            <label for="">TEXT</label>
            <!-- type="text": 일반 텍스트 입력 필드 (기본값) -->
            <input type="text">
        </div>
        <div>
            <label for="">SEARCH</label>
            <!-- type="search": 검색어 입력 필드. text와 거의 동일하나 브라우저에 따라 X 버튼이 생긴다 -->
            <input type="search">
        </div>
        <div>
            <label for="">URL</label>
            <!-- type="url": URL 형식 입력 필드. 유효성 검증해 http:// 등 주소 형식이 아니면 submit을 막는다 -->
            <input type="url">
        </div>
    </form>
</body>
</html>
