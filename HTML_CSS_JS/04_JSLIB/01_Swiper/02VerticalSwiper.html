<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerticalSwiper</title>
    <!--
        =======================================
        Swiper 세로 슬라이더
        배너 슬라이더와 함께 상단 안내 문구를 세로 방향으로 자동 전환
        =======================================
    -->

    <!-- GOOGLE ICON -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 48;

            font-size: 2.5rem;
            border: 3px solid;
            border-radius: 50%;
        }
    </style>

    <!-- SWIPER CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
        }

        ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        a {
            text-decoration: none;
            color: black;
        }

        .wrapper {}

        /*  */
        .wrapper>header {}

        .wrapper>header>.top-header {
            height: 50px;
            padding: 10px 0;
        }

        .wrapper>header>.top-header>.swiper {
            height: 100%;
            background-color: orange;
        }

        .wrapper>header>.top-header>.swiper>.swiper-wrapper {}

        .wrapper>header>.top-header>.swiper>.swiper-wrapper>.swiper-slide {}

        .wrapper>header>nav {}

        /*  */
        .wrapper>main {}

        .wrapper>main>section {}

        .wrapper>main>section.main-banner {}

        .wrapper>main>section.main-banner>.swiper {
            width: 100%;
            height: 720px;
            position: relative;
            /* border : 5px solid red; */



        }

        .wrapper>main>section.main-banner>.swiper>.swiper-wrapper {
            height: 100%;
        }

        .wrapper>main>section.main-banner>.swiper>.swiper-wrapper>.swiper-slide {
            height: 100%;
        }

        .wrapper>main>section.main-banner>.swiper>.swiper-wrapper>.swiper-slide>a {
            display: block;
            width: 100%;
            height: 100%;


        }

        .wrapper>main>section.main-banner>.swiper>.swiper-wrapper>.swiper-slide>a>img {
            /* object-fit: cover; */

        }

        .wrapper>main>section.main-banner>.swiper>.swiper-button-prev,
        .wrapper>main>section.main-banner>.swiper>.swiper-button-next {
            width: 35px;
            height: 35px;
            /* border: 1px solid white; */
            position: absolute;
            border-radius: 50%;
            color: white;
            top: 600px;

        }

        .wrapper>main>section.main-banner>.swiper>.swiper-button-prev>svg,
        .wrapper>main>section.main-banner>.swiper>.swiper-button-next>svg {
            display: none;
        }

        .wrapper>main>section.main-banner>.swiper>.swiper-button-prev::after {
            content: '<';
            font-size: 1.5rem;
            /* border: 1px solid; */
            transform: scaleY(1.5);

        }

        .wrapper>main>section.main-banner>.swiper>.swiper-button-next::after {
            content: '>';
            font-size: 1.5rem;
            /* border: 1px solid; */
            transform: scaleY(1.5);
        }

        .wrapper>main>section.main-banner>.swiper>.swiper-button-prev {
            left: 25%;
        }

        .wrapper>main>section.main-banner>.swiper>.swiper-button-next {
            left: calc(25% + 120px);
        }


        .wrapper>main>section.main-banner>.swiper>.swiper-pagination {
            color: white;
            font-size: 1.3rem;
            position: absolute;
            top: 580px;
            left: calc(25% + 25px);
            width: 100px;
            height: auto;
        }

        .start-stop-toggle {
            position: absolute;

            top: 575px;
            left: calc(25% - 55px);
            cursor: pointer;
            color: white;
            z-index: 1;
            transition: .4s;


        }

        .swiper-pagination-current {
            color: orange;
        }

        /*  */
        .wrapper>footer {}
    </style>

</head>

<body>


    <div class="wrapper">
        <header>
            <div class="top-header">
                <!-- 상단 안내 문구 슬라이더 -->
                <!-- Swiper 컨테이너 -->
                <div class="swiper">
                    <!-- 슬라이드를 감싸는 wrapper (필수) -->
                    <div class="swiper-wrapper">
                        <!-- 슬라이드 -->
                        <div class="swiper-slide">[공지] 오늘 휴강 공지</div>
                        <div class="swiper-slide">[공지] 공지사항 1</div>
                        <div class="swiper-slide">[공지] 공지사항 2</div>
                        <div class="swiper-slide">[공지] 공지사항 3</div>
                    </div>

                </div>
            </div>
            <nav></nav>
        </header>

        <main>
            <!-- BANNER SECTION -->
            <section class="main-banner">
                <!-- Swiper 컨테이너 -->
                <div class="swiper">
                    <!-- 슬라이드를 감싸는 wrapper (필수) -->
                    <div class="swiper-wrapper">
                        <!-- 슬라이드 -->
                        <div class="swiper-slide">
                            <a href="javascript:void(0)">
                                <img src="./images/1.jpg" alt="">
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a href="javascript:void(0)">
                                <img src="./images/2.jpg" alt="">
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a href="javascript:void(0)">
                                <img src="./images/3.jpg" alt="">
                            </a>
                        </div>
                        <div class="swiper-slide">
                            <a href="javascript:void(0)">
                                <img src="./images/4.jpg" alt="">
                            </a>
                        </div>

                    </div>
                    <!-- 페이지 표시 -->
                    <div class="swiper-pagination"></div>

                    <!-- 이전, 다음 버튼 -->
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>

                    <!-- stop/start button  -->
                    <div class="start-stop-toggle">
                        <span class="material-symbols-outlined">
                            <!-- pause -->
                            play_arrow
                        </span>
                    </div>


                    <!-- 스크롤바 (사용 안 함) -->
                    <!-- <div class="swiper-scrollbar"></div> -->
                </div>
            </section>

            <section></section>
            <section></section>
            <section></section>
        </main>
        <footer></footer>
    </div>


    <script>
        // new Swiper('선택자', {옵션}) : 선택자의 요소를 슬라이더로 만든다
        const mainBannerSwiper = new Swiper('.main-banner>.swiper', {
            // 기본 옵션
            direction: 'horizontal',  //vertical:수직 , horizontal(수평)
            // autoplay : 자동 재생. delay는 슬라이드가 넘어가는 간격(ms)
            autoplay: {
                delay: 2000,
                // pauseOnMouseEnter:true,
            },
            // loop : 마지막 슬라이드 다음에 첫 슬라이드로 이어진다
            loop: true,
            effect: "slide", // slide(기본), fade , scroll, cube , coverflow , flip
            // mousewheel : 마우스 휠로 슬라이드 이동
            mousewheel: true,

            // 페이지 표시 옵션
            // pagination : 현재 위치 표시. type은 bullets(기본), fraction, progressbar, clickable은 클릭해서 이동
            pagination: {
                el: '.main-banner>.swiper>.swiper-pagination',
                clickable: true,
                type: 'fraction', //bullets(기본), fraction , progressbar
            },

            // 이전, 다음 버튼 옵션
            // navigation : 이전(prevEl), 다음(nextEl) 버튼으로 사용할 요소 지정
            navigation: {
                nextEl: '.main-banner>.swiper>.swiper-button-next',
                prevEl: '.main-banner>.swiper>.swiper-button-prev',
            },

            // 스크롤바 옵션 (사용 안 함)
            // scrollbar: {
            //     el: '.swiper-scrollbar',
            // },
        });

        console.log(mainBannerSwiper);

        // 재생, 정지 버튼 : autoplay.stop()과 autoplay.start()로 자동 재생을 제어
        const playToggleBtn = document.querySelector('.start-stop-toggle span');
        let isPlay = true;
        playToggleBtn.addEventListener('click', () => {

            if (isPlay) {
                playToggleBtn.innerHTML = 'pause';
                isPlay = false;
                mainBannerSwiper.autoplay.stop();
            }
            else {
                playToggleBtn.innerHTML = 'play_arrow';
                isPlay = true;
                mainBannerSwiper.autoplay.start();
            }

        });


        // 상단 안내 문구 : direction을 'vertical'로 지정하면 세로 방향으로 슬라이드
        const topHeaderSwiper = new Swiper('.top-header>.swiper', {
            // 기본 옵션
            direction: 'vertical',
            autoplay : {
                delay : 2000,
            },
            loop: true,
        });

    </script>

</body>

</html>
