<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GsapTo</title>
    <!--
        =======================================
        GSAP gsap.to
        선택한 요소를 지정한 값까지 움직이는 애니메이션(이동, 회전, 크기, 색)
        =======================================
    -->

    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"
        integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
        .box {
            margin: 20px;
            width: 100px;
            height: 100px;
        }

        .box1 {
            background: orange;
        }

        .box2 {
            background: greenyellow;
        }

        .box3 {
            background: tomato;
        }
    </style>
</head>

<body>


    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3">box</div>

    <script>

        // GSAP: HTML 요소 움직일 수 있는 JS 애니메이션 라이브러리
        // gsap.to("css선택자", { 어떻게 움직일지 옵션 설정 })  

        console.log(gsap);
        gsap.to('.box1', { 
            duration: 3, // 애니메이션 시간(초)
            x: 200, // 오른쪽 이동 거리(px)
            y: 200, // 아래쪽 이동 거리(px)
            opacity: 0.2, // 투명도(0~1)
            ease: 'steps(10)', // 움직임 방식. steps: 10단계 뚝뚝 끊어 이동 
            delay: 2, // 시작 시간(초) -> 2초 후 시작
        })
        gsap.to(".box2", { 
            duration: 3, x: 200, 
            rotate: 720, // 회전(도) -> 720도/ 2바퀴 회전
            scale: 1.3, // 사이즈 조절 -> 1.3배 크게
        });
        gsap.to(".box3", { 
            duration: 3, x: 200, 
            ease: 'elastic', // 움직임 방식. elastic: 고무줄처럼 튕기며 이동
            backgroundColor: 'gray', // 배경색 변경
            width: 300, // 가로크기 변경(px)
            fontSize: 60 // 글자 크기 변경(px)
        });
    </script>

</body>

</html>
