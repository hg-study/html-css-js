<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiScene</title>
    <!--
        =======================================
        ScrollMagic 여러 요소 감시
        section마다 다른 class(move1, move2)를 적용해 각각 다른 애니메이션 실행
        =======================================
    -->

    <!-- SCROLLMAGIG CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ScrollMagic/2.0.8/ScrollMagic.min.js"
        integrity="sha512-8E3KZoPoZCD+1dgfqhPbejQBnQfBXe8FuwL4z/c8sTrgeDMFEnoyTlH3obB4/fV+6Sg0a0XF+L/6xS4Xx1fUEg=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
        section {
            width: 1280px;
            margin: 0 auto;
            height: 800px;
            border: 1px solid;
            margin-bottom: 20px;
            position: relative;
        }

        .ball {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 1px solid;

            position: absolute;
            left: 0;
            top: 0;
            transition: .5s;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .second .ball {
            position:absolute;
            left: calc(100% - 100px);
            
        }

        .move1 {
            left: calc(100% - 100px);
            top: calc(100% - 100px);

            transform: rotate(180deg);
            background-color: black;
            color: white;
            transition: 2s;
        }

        .second .move2 {
            left : 0;
            top: calc(100% - 100px);

            transform: rotate(180deg);
            background-color: orange;
            color: white;
            transition: 2s;
        }
    </style>
</head>

<body>

    <section></section>
    <section class="scroll-section scroll-spy first">
        <div class="ball">BALL</div>
    </section>
    <section class="scroll-section scroll-spy second">
        <div class="ball">BALL</div>
    </section>
    <section></section>


    <script>

        const spyedEls = document.querySelectorAll('.scroll-spy');  // scroll-spy class 모두 검색
        spyedEls.forEach((spyedEl) => {  // 반복문 시작
            
            if (spyedEl.classList.contains('first')) {  // classList.contains : 현재 섹션이 first class를 가지고 있는지 확인(true, false)

                const ballEl = spyedEl.querySelector('.ball'); // 그 섹션 spyedEl 내부의 .ball 가져오기
                
                //스크롤 매직 객체
                new ScrollMagic // 스크롤 매직 라이브러리.
                    .Scene({                                            //감시 위치 옵션. 어디서 발동할지 선택
                        triggerElement: spyedEl,                         //감시할 요소 지정. 이 요소가 화면에 들어오면 발동
                        triggerHook: 0.5,                                //화면 어느 부분에서 발동할지. 스크롤 위치값(0-1, 0:최상단, .5:중앙, 1:최하단)
                    })

                    .setClassToggle(ballEl, 'move1')                      // 클래스를 조건에 따라 자동 적용/제거. (스크롤이 triggerHook에 닿으면 move1 적용, 벗어나면 제거) 애니메이션 효과 적용
                    .addTo(new ScrollMagic.Controller());               // addTo: 위 Scene을 Controller에 등록, ScrollMagic.Controller(): 제어부(스크롤 상황 감시)

            } else if (spyedEl.classList.contains('second')) {
                
                const ballEl = spyedEl.querySelector('.ball');
                //스크롤 매직 객체
                new ScrollMagic
                    .Scene({                                            //감시 위치 옵션
                        triggerElement: spyedEl,                         //감시할 요소
                        triggerHook: 0.5,                                //스크롤 위치값(0-1, 0:최상단, .5:중앙, 1:최하단)
                    })

                    .setClassToggle(ballEl, 'move2')                      //애니메이션 효과 적용
                    .addTo(new ScrollMagic.Controller());               //제어부(스크롤 상황 감시)

            }

        })

    </script>
</body>

</html>
