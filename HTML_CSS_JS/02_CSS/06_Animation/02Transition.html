<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition2</title>
    <!--
        =======================================
        transition 활용
        div에 마우스를 올리면 안의 이미지가 아래로 내려오는 효과
        =======================================
    -->

    <style>

        *{box-sizing: border-box;}

        div{
            width: 100px;
            height: 500px;
            border: 1px solid;
            margin: 10px 30px;
            display: inline-block;
        }

        img{
            width: 100%;
            height: 100px;
            border: 1px solid gray;
            position: relative;     /* top 값으로 이동하려면 position 지정이 필요 */
            left: 0;
            top: 0;
            transition: 3s;        /* 원래 위치로 돌아올 때 3초 */            
        }

        div:hover img{
            top: 400px;
            transition: .5s;    /* 내려올 때 0.5초 */
        }



    </style>

</head>
<body>
    <div><img src="https://image.msbg.io/?p=mocoblob.blob.core.windows.net%2Ftalkarticle%2F4521_1636614530509_0"></div>
    <div><img src="https://www.palnews.co.kr/news/photo/201801/92969_25283_5321.jpg"></div>
    <div><img src="https://pds.joongang.co.kr/news/component/htmlphoto_mmdata/201901/20/28017477-0365-4a43-b546-008b603da621.jpg"></div>
</body>
</html>
