<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <!--
        =======================================
        transition 전환 효과
        hover 시 너비가 변할 때 걸리는 시간을 상태별로 지정
        =======================================
    -->

    <style>
        div{
            width: 100px;
            height: 50px;
            margin: 10px;
            background-color: orange;
            transition: 2s;     /* transition : 속성이 바뀔 때 변화에 걸리는 시간. 기본 상태에 쓰면 원래대로 돌아올 때 적용 */
        }

        div:hover{
            width: 500px;
            transition: .5s;    /* hover 상태에 쓰면 hover가 시작될 때 적용 */
        }

        div:nth-child(1){
            /* transition: 1s; */
        }
        div:nth-child(2){
            /* transition: .5s; */
        }
        div:nth-child(3){
            /* transition: .8s; */
        }


    </style>

</head>
<body>
    <div></div>
    <div></div>
    <div></div>
</body>
</html>
