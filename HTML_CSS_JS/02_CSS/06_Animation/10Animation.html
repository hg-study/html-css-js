<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation4</title>
    <!--
        =======================================
        animation-timing-function
        같은 움직임에 속도 곡선을 달리 적용해 비교
        =======================================
    -->
    <style>
        div{
            width:100px;height:50px;background-color: orange;margin:10px;position:relative;

            /* animation */
            animation-name: moving;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }
        .d1{
            /* ease : 느리게 시작해 빨라지다가 느리게 끝남 (기본값) */
            animation-timing-function: ease;
        }
        .d2{
            /* ease-in : 느리게 시작해 점점 빨라짐 */
            animation-timing-function: ease-in ;
        }
        .d3{
            /* ease-out : 빠르게 시작해 점점 느려짐 */
            animation-timing-function: ease-out;
        }
        .d4{
            /* ease-in-out : 느리게 시작해 느리게 끝남. ease보다 가운데가 완만 */
            animation-timing-function: ease-in-out;
        }
        .d5{
            /* linear : 처음부터 끝까지 일정한 속도 */
            animation-timing-function: linear;
        }
        @keyframes moving {
            from{left:0px} to{left:1000px;}
        }
    </style>
</head>
<body>
    

    <div class="d1">ease(기본)</div>
    <div class="d2">ease-in</div>
    <div class="d3">ease-out</div>
    <div class="d4">ease-in-out</div>
    <div class="d5">linear</div>
</body>
</html>
