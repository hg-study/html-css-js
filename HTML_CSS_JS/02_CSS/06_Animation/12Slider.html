<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider</title>
    <!--
        =======================================
        자동 슬라이더
        animation으로 목록을 옆으로 계속 이동하고 hover 시 멈춤
        =======================================
    -->

    <style>
        *{box-sizing: border-box;}
        body{margin: 0; padding: 0;}

        .slider-block{
            width: 1200px;
            height: 300px;
            border: 1px solid;
            margin: 50px auto;

            display: flex;
            align-items: center;

            overflow: hidden;
        }
        .slider-block>.slider-wrapper{
            width: 3000px;
            height: 150px;
            /* border: 1px solid; */

            display: flex;
            align-items: center;

            position: relative;

            animation-name: moving;
            animation-duration: 20s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            animation-direction: alternate;     /* 끝에 닿으면 반대로 되돌아감 */
        }
        .slider-block>.slider-wrapper>.item{
            width: 200px;
            height: 150px;
            border: 1px solid;
            margin: 10px;
            background-color: white;
            transition: .4s;
        }

        /* animation-play-state : paused로 애니메이션을 일시 정지 */
        .slider-block>.slider-wrapper:hover {
            animation-play-state: paused;
        }

        .slider-block>.slider-wrapper>.item:hover {
            transform: scale(1.5);
        }


        @keyframes moving {
            from {
                left: 0;

            }
            to {
                left: -2000px;
            }
        }

    </style>



</head>
<body>
    
    <div class="slider-block">
        <div class="slider-wrapper">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item">5</div>
            <div class="item">6</div>
            <div class="item">7</div>
            <div class="item">8</div>
            <div class="item">9</div>
            <div class="item">10</div>
        </div>
    </div>

</body>
</html>
