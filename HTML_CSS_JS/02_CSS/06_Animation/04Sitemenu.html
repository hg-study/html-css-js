<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemenu</title>
    <!--
        =======================================
        사이트 메뉴(햄버거 버튼)
        체크박스와 label로 햄버거 버튼을 만들고 클릭하면 X로 변하며 전체 메뉴 영역이 나타남
        =======================================
    -->

    <!-- GOOGLE ICON -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />   
    <!-- 구글 아이콘 URL 끝의 &icon_names=... 부분을 지우면 모든 아이콘을 사용할 수 있다 -->


        <style>
            .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 220,
            'GRAD' 0,
            'opsz' 24
            }
        </style>



    <style>

        *{box-sizing: border-box;}
        body {margin: 0; padding: 0;}
        ul {list-style: none; padding: 0; margin: 0;}
        a {text-decoration: none; color: black;}

        /* layout */
        /* 콘텐츠 폭을 1080px로 고정하고 가운데 정렬 */
        .layout {
          width: 1080px;
          margin: 0 auto;
        }
        
        .wrapper {}

        /* layout-header */

        .wrapper>header {
          border-bottom: 1px solid rgb(236, 236, 236); 
          margin-bottom: 10px;
        }


        .wrapper>header>.top-header {}
        /* 상단 보조 메뉴 : 오른쪽 정렬 */
        .wrapper>header>.top-header>ul {
            /* border: 1px solid; */
            display: flex;
            justify-content: right;
        }
        .wrapper>header>.top-header>ul>li {
            /* border: 1px solid; */
            padding: 5px 10.5px;
        }

        .wrapper>header>.top-header>ul>li:last-child {
            padding-right: 0;
        }

        .wrapper>header>.top-header>ul>li>a {
            display: block;
            font-size: .65rem;
            color: rgb(112, 112, 112);
        }

        .wrapper>header>nav {}
        /* 로고는 왼쪽, 메뉴와 아이콘은 오른쪽 끝에 배치 */
        .wrapper>header>nav>.nav-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .wrapper>header>nav>.nav-top>.left-logo {}
        .wrapper>header>nav>.nav-top>.left-logo>img {
            width: 115px;
        }
        .wrapper>header>nav>.nav-top>.right-gab {
            display: flex;
            justify-content: space-between;
            height: 40px;
            gap: 10px;
        }
        .wrapper>header>nav>.nav-top>.right-gab>.nav-menu {
            width: 100%;
        }
        .wrapper>header>nav>.nav-top>.right-gab>.nav-menu>ul {
            display: flex;
            align-items: center;
            height: 100%;
        }
        .wrapper>header>nav>.nav-top>.right-gab>.nav-menu>ul>li {
            font-size: 1.13rem;
            padding: 5px 10px;
            position: relative;
        }

        .wrapper>header>nav>.nav-top>.right-gab>.nav-menu>ul>li:nth-child(1) {
          font-weight: 800;
        }
      
        .wrapper>header>nav>.nav-top>.right-gab>.nav-menu>ul>li:nth-child(2)::after {
            content: '';
            display: block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: tomato;
            position: absolute;
            top: 6px;
            right: 5.5px;
        }
        .wrapper>header>nav>.nav-top>.right-gab>.nav-menu>ul>li>a {
            display: block;
        }

        .wrapper>header>nav>.nav-top>.right-gab>.nav-icon {
            width: 100%;
            
        }
        .wrapper>header>nav>.nav-top>.right-gab>.nav-icon>ul {
            display: flex;     
            justify-content: right; 
            align-items: center;
            height: 100%;
        }
        .wrapper>header>nav>.nav-top>.right-gab>.nav-icon>ul>li {
          padding: 10px;
          
        }
        .wrapper>header>nav>.nav-top>.right-gab>.nav-icon>ul>li:last-child {
          padding-right: 0;
        }        
        .wrapper>header>nav>.nav-top>.right-gab>.nav-icon>ul>li>a {
          display: block;
        }
        .wrapper>header>nav>.nav-top>.right-gab>.nav-icon>ul>li>a>span {
          font-size: 1.7rem;
          vertical-align: middle;
        }

        .wrapper>header>nav>.nav-bottom  {
          height: 35px;
        }
        .wrapper>header>nav>.nav-bottom >ul {
          display: flex;
          justify-content: left;
          align-items: center;
          height: 100%;
        }
        .wrapper>header>nav>.nav-bottom >ul>li {
          font-size: 0.85rem;    
          padding: 5px 11.5px;
          padding-bottom: 0;
          height: 100%;
        }

        .wrapper>header>nav>.nav-bottom >ul>li:first-child {
          padding-left: 0;
        }        
        .wrapper>header>nav>.nav-bottom >ul>li>a {
          height: 100%;
          display: block;
        }
        .wrapper>header>nav>.nav-bottom >ul>li>a:hover{
          border-bottom: 2px solid;
        }

        /* layout-main */
        .wrapper>main {}
        .wrapper>main>section {
          min-height: 250px;
          padding: 40px 0px;
        }
        .wrapper>main>section.banner {
          margin-top: 30px;
          height: 420px;
          border-radius: 20px;
          background-color: lightgray;
        }

        /* 상품 목록 : grid로 8열 배치 */
        .wrapper>main>section.items-good {     
          display: grid;
          grid-template-columns: repeat(8,1fr);
          gap: 10px;
        }
        
        .wrapper>main>section.items-good>.item {     
          border: 1px solid;
          min-height: 130px;
        }


        /* layout-footer */
        .wrapper>footer {}


        /* sitemenu css */
        /* 체크박스는 숨기고 label의 span 3개로 햄버거 선을 그린다. 체크되면 선이 X로 변하고 메뉴 영역이 표시된다 */
        #sitemenu{
          position: relative;
        }
        #sitemenu>input[type="checkbox"]{
          display: none;
        }
        #sitemenu>label{
          cursor: pointer;
        }
        /* transform-origin : 변형의 기준점. center는 요소 가운데를 기준으로 회전 */
        #sitemenu>label>span{
          display: block;
          width: 22px;
          height: 2px;
          margin: 6px;
          background-color: rgb(83, 83, 83);
          transform-origin: center;
          transition: .4s;
        }

        /* 첫 번째 선은 아래로 이동하며 45도 회전 */
        #sitemenu>input[type="checkbox"]:checked+label>span:nth-child(1){
          transform: translate(0px, 8px) rotate(45deg);
        }
        /* 가운데 선은 숨김. transition을 0으로 해서 바로 사라지게 함 */
        #sitemenu>input[type="checkbox"]:checked+label>span:nth-child(2){
          visibility: hidden;
          transition: 0s;
        }
        /* 세 번째 선은 위로 이동하며 -45도 회전해 X 모양을 만듦 */
        #sitemenu>input[type="checkbox"]:checked+label>span:nth-child(3){
          transform: translate(0px, -8px) rotate(-45deg);
        }

        /* 전체 메뉴 영역 : 평소에는 숨김 */
        #sitemenu>.site-block{
          position: absolute;
          left: -1240px;
          top: 50px;
          width: 1290px;
          height: 90vh;

          background-color: orange;
          display: none;
        }

        /* 체크되면(~ 뒤의 형제) 메뉴 영역 표시 */
        #sitemenu>input[type="checkbox"]:checked~.site-block{
          display: block;
        }

    </style>






</head>
<body>
    <!-- .wrapper>header>.top-header+nav^main>section^footer -->

    <div class="wrapper">
        <header>
            <div class="top-header  layout">
                <!-- ul>li*5>a[href="javascript:void(0)"]{메뉴$} -->
                <ul>
                    <li><a href="javascript:void(0)">고객센터</a></li>
                    <li><a href="javascript:void(0)">마이페이지</a></li>
                    <li><a href="javascript:void(0)">관심</a></li>
                    <li><a href="javascript:void(0)">알림</a></li>
                    <li><a href="javascript:void(0)">로그인</a></li>
                </ul>

            </div>
            <nav class="layout">

                <div class="nav-top">
                    <div class="left-logo">
                        <img src="./logo.svg" alt="">
                    </div>
                    <div class="right-gab">
                        <div class="nav-menu">
                            <!-- ul>li*3>a[href="javascript:void(0)"]{m} -->
                            <ul>
                                <li><a href="javascript:void(0)">HOME</a></li>
                                <li><a href="javascript:void(0)">STYLE</a></li>
                                <li><a href="javascript:void(0)">SHOP</a></li>
                            </ul>
                        </div>
                        <div class="nav-icon">
                            <ul>
                                <li><a href="javascript:void(0)">

                                    <span class="material-symbols-outlined">
                                    search
                                    </span>
                                    
                                  </a></li>
                                  <li><a href="javascript:void(0)">

                                    <span class="material-symbols-outlined">
                                    shopping_bag
                                    </span>    
                                    
                                  </a></li>

                                  <!-- SITEMENU -->
                                  <li id="sitemenu">
                                    <input type="checkbox" id="chk">
                                    <label for="chk">
                                      <span></span>
                                      <span></span>
                                      <span></span>
                                    </label>

                                    <div class="site-block"></div>
                                  </li>
                            </ul>                        
                        </div>
                    </div>

                </div>
                <div class="nav-bottom">

                  <!-- ul>li*9>a[href="javascript:void(0)"]{MENU} -->
                  <ul>
                    <li><a href="javascript:void(0)">산산기어26SS</a></li>
                    <li><a href="javascript:void(0)">추천</a></li>
                    <li><a href="javascript:void(0)">🌸봄맞이</a></li>
                    <li><a href="javascript:void(0)">신상</a></li>
                    <li><a href="javascript:void(0)">뷰티</a></li>
                    <li><a href="javascript:void(0)">럭셔리</a></li>
                    <li><a href="javascript:void(0)">랭킹</a></li>
                    <li><a href="javascript:void(0)">중고</a></li>
                    <li><a href="javascript:void(0)">이벤트</a></li>
                  </ul>

                </div>

            </nav>
        </header>
        <main class="layout">
            <section class="banner"></section>
            <section class="items-good">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
            <div class="item">4</div>
            <div class="item">5</div>
            <div class="item">6</div>
            <div class="item">7</div>
            <div class="item">8</div>
            <div class="item">9</div>
            <div class="item">10</div>
            <div class="item">11</div>
            <div class="item">12</div>
            <div class="item">13</div>
            <div class="item">14</div>
            <div class="item">15</div>
            <div class="item">16</div>
            </section>
        </main>
        <footer></footer>
    </div>

</body>
</html>
