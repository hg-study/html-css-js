<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FontFamily</title>
    <!--
        =======================================
        글꼴 적용
        Google Font, 폰트 파일 등록(@font-face), 웹 폰트 CDN
        =======================================
    -->

    <!-- GOOGLE FONT -->
    <!-- preconnect : 폰트 서버와 미리 연결해 로딩 속도를 높인다 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Qwitcher+Grypen:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* GOOGLE FONT CSS */

        :root {
            font-size: 50px;    /* root 글자 크기. rem의 기준이 되어 문서 전체 글자 크기가 달라진다 */
        }

        .qwitcher-grypen-regular {
            font-family: "Qwitcher Grypen", cursive;
            font-weight: 400;
            font-style: normal;
        }

        /* FONT 등록  */
        /* 프로젝트 안의 폰트 파일을 경로로 지정 */
        /* @font-face : 폰트 파일을 불러와 font-family 이름을 붙여 등록하는 규칙 */
        @font-face {
            font-family: 'custom-01';
            src: url("../../../.github/fonts/NanumGangInHanWiRo.ttf");
            font-style: normal;
        }

        @font-face {
            font-family: 'OngleipParkDahyeon';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2411-3@1.0/Ownglyph_ParkDaHyun.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;     /* 폰트 로딩 전에는 기본 글꼴로 먼저 표시 */
        }

        body {
            font-family: 'OngleipParkDahyeon';
            /* body에 지정하면 문서 전체의 기본 글꼴이 된다 */
        }
    </style>

</head>

<body>
    <!-- 각 줄은 서로 다른 방식으로 글꼴을 지정한다. 폰트가 없으면 다음 후보나 기본 폰트로 표시된다 -->
    <!-- font-family : 쉼표로 우선순위를 지정하고, 앞의 폰트가 없으면 다음 폰트를 적용한다. -->
    <div style="font-family: 'Times New Roman', Times, serif;">HELLO WORLD</div>
    <div>HELLOWORLD♧
</div>
    <div class="qwitcher-grypen-regular">HELLO WORLD</div>
    <div style="font-family: 'custom-01';">HELLOWORLD</div>
</body>

</html>
