<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background</title>
    <!--
        =======================================
        배경 이미지
        background-image, repeat, size, attachment 적용
        =======================================
    -->

    <style>
        *{box-sizing: border-box;}    /* 모든 요소의 크기 계산에 padding, border 포함 */
        body{margin: 0; padding: 0;}    /* 브라우저 기본 여백 제거 */
        .wrapper{height: 5000px;}   /* 스크롤 확인용 높이 */
        .bg{
            position: absolute;     /* 문서 흐름에서 빼고 위치를 직접 지정 */
            top: 800px;             /* 스크롤하면 나타나는 위치에 배치 */
            width: 100%;
            height: 400px;
            /* background-color: orange; */
            background-image: url(./images/bg.jpg);    /* 배경 이미지 지정 */
            background-repeat: no-repeat;               /* 이미지 반복 안 함 */
            /* cover : 요소를 빈틈없이 채우도록 확대(일부 잘림), contain : 이미지 전체가 보이도록 축소(여백 생김) */
            background-size: contain;
            background-attachment: fixed;               /* 스크롤해도 배경 이미지를 뷰포트에 고정 */
        }
    </style>

</head>

<body>
    <div class="wrapper">
        <div class="bg"></div>
    </div>
</body>

</html>
