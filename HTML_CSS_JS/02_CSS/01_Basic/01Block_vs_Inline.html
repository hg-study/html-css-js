<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block vs Inline</title>
    <!--
        =======================================
        Block 요소 vs Inline 요소
        div와 span에 같은 박스 속성을 적용해 display에 따른 차이 확인
        =======================================
    -->
    <style>
        div{
            width: 200px;
            height: 250px;
            border: 1px solid;
            margin: 10px;
            padding: 10px;
            display: inline;    /* 인라인 요소로 표시. width, height 적용 안 됨 */
        }

        span{
            width: 200px;           /* inline에서는 미적용, inline-block이므로 적용 */
            height: 250px;          /* inline에서는 미적용, inline-block이므로 적용 */
            margin: 10px;           /* inline에서는 좌우만 적용 */
            border: 1px solid;      /* inline에서도 적용 */
            padding: 10px;          /* inline에서도 적용 */
            display: block;         /* 블럭 요소로 표시. 아래 inline-block이 덮어씀 */
            display: inline-block;  /* 한 줄에 배치되면서 width, height 적용 */
        }
    </style>
</head>
<body>

    <!--
        블럭형 태그(ex.div): 1행 전체를 사용하는 태그
        width: o, height: o, margin: o, padding: o
        인라인 태그(ex.span): 1행을 함께 공유하는 태그
        width: x, height: x, margin: left/right/padding: o

        display
        inline       : 인라인 요소로 표시. width, height, 상하 margin 적용 안 됨
        block        : 블럭 요소로 표시. 1행 전체를 차지
        inline-block : 한 줄에 함께 배치되면서 width, height 적용 가능
        같은 속성이 겹치면 아래에 쓴 값이 적용되므로 span은 inline-block이 적용된다.
    -->

    <div>HELLO WORLD</div>
    <div>HELLO WORLD</div>
    <hr/>
    <span>HI WORLD</span>
    <span>HI WORLD</span>
</body>
</html>
