<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color</title>
    <!--
        =======================================
        색상 표기 방식
        rgb, rgba, HEX 코드로 글자색 지정
        =======================================
    -->
</head>

<style>
    h1{color: rgb(67, 127, 155);}   /* rgb(R, G, B) : 빨강, 초록, 파랑을 0~255로 표기 */
    h2{color: rgb(105, 163, 190);}
    h3{color: rgba(105, 163, 190,0.7);} /* rgba(R, G, B, 투명도) : 투명도는 0(투명) ~ 1(불투명) */
    h4{color: #C1DBE7;} /* #RRGGBB : 16진수 색상 코드 */
</style>

<body>
    <h1>HELLOWORLD</h1>
    <h2>HELLOWORLD</h2>
    <h3>HELLOWORLD</h3>
    <h4>HELLOWORLD</h4>
</body>
</html>
