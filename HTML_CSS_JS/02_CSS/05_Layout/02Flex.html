<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex2</title>
    <!--
        =======================================
        flex 자식 속성
        flex-grow, flex-shrink, flex-basis, align-self로 자식 요소 크기와 정렬 조절
        =======================================
    -->

    <style>
        *{box-sizing: border-box;}
        body{margin: 0;}
        .parent{
            /* width: 1440px; */
            width: 100%;
            height: 950px;
            border: 1px solid;
            margin: 0 auto;
            padding: 10px;

            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        .parent>.son{
            border: 1px solid;
        }
        .parent>.son:nth-child(1){
            /* flex-grow : 남는 공간을 나누어 가지는 비율
            flex-shrink : 공간이 부족할 때 줄어드는 비율 (0이면 줄어들지 않음)
            flex-basis : 요소의 기본 크기. width: 100px;와 겹치므로 flex-grow를 쓸 때는 width를 지정하지 않는다 */
            flex-grow: 1;
            flex-shrink: 0;
            flex-basis: 200px;
            /* justify-self: stretch; */
            /* align-self : 이 요소만 교차축(세로) 정렬을 따로 지정. stretch는 교차축을 꽉 채움 */
            align-self: stretch;
        }
        .parent>.son:nth-child(2){
            flex-grow: 1;
            flex-shrink: 0;
            flex-basis: 200px;
            align-self: flex-start;     /* 위쪽 정렬 */

        }
        .parent>.son:nth-child(3){
            flex-grow: 1;
            flex-shrink: 0;
            flex-basis: 200px;
            align-self: flex-end;       /* 아래쪽 정렬 */

        }
        .parent>.son:nth-child(4){
            flex-grow: 1;
            flex-shrink: 0;
            flex-basis: 200px;
            
        }
        .parent>.son:nth-child(5){
            flex-grow: 1;
            flex-shrink: 0;
            flex-basis: 200px;

        }

    </style>

</head>
<body>
    
    <!-- .parent>.child*5{$} -->

    <div class="parent">
        <div class="son">1</div>
        <div class="son">2</div>
        <div class="son">3</div>
        <div class="son">4</div>
        <div class="son">5</div>
    </div>

</body>
</html>
