<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexPlus</title>
    <!--
        =======================================
        flex 기본 속성
        01Flex에 전체 폭 고정(wrapper 1440px)과 가운데 정렬을 추가한 버전
        =======================================
    -->
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }

        .wrapper {
            width: 1440px;
            /* height:950px; */
            margin: 0 auto;
            border: 1px solid;
            padding: 10px;
        }

        .wrapper>.parent1 {
            height: 350px;
            border: 1px solid;
            /* display: flex : 자식 요소를 한 줄로 배치하는 flex 컨테이너가 된다 */
            display: flex;

            /* flex-direction : 주축 방향. row(기본값), column, row-reverse, column-reverse */
            flex-direction: row;
            /* justify-content : 주축(row면 가로) 방향 정렬. left, right, center, space-between, space-evenly, space-around, end */
            justify-content: center;
            /* align-items : 교차축(row면 세로) 방향 정렬. start, end, center, stretch */
            align-items: center;
            /* gap : 자식 요소 사이 간격 */
            gap: 20px;
            margin-bottom: 20px;
        }

        .wrapper>.parent1>.son {
            /* height : 40px; */
            width: 200px;
            border: 1px solid;
        }

        .wrapper>.parent2 {
            border: 1px solid;
            width: 1280px;
            padding: 10px 12px;
            margin: 0 auto;
            display: flex;
            /* flex-wrap : 한 줄에 다 담지 못할 때 줄바꿈 여부. nowrap(한 줄에 모두 배치), wrap(다음 줄로 넘김) */
            flex-wrap: wrap;
            justify-content: flex-start;

            gap: 10px;
            /* padding:10px; */
            background-color: orange;

        }

        .wrapper>.parent2>.son {
            /* width:200px; */
            width: 200px;
            height: 200px;
            border: 1px solid;
            background-color: beige;
        }
    </style>
</head>

<body>


    <div class="wrapper">
        <div class="parent1">
            <div class="son">1</div>
            <div class="son">2</div>
            <div class="son">3</div>
            <div class="son">4</div>
            <div class="son">5</div>
        </div>
        <div class="parent2">
            <div class="son">1</div>
            <div class="son">2</div>
            <div class="son">3</div>
            <div class="son">4</div>
            <div class="son">5</div>
            <div class="son">6</div>
            <div class="son">7</div>
            <div class="son">8</div>
            <div class="son">9</div>
            <div class="son">10</div>
            <div class="son">11</div>
            <div class="son">12</div>
            <div class="son">13</div>
            <div class="son">14</div>
            <div class="son">15</div>
            <div class="son">16</div>
            <div class="son">17</div>
            <div class="son">18</div>
            <div class="son">19</div>
            <div class="son">20</div>
        </div>
    </div>
</body>

</html>
