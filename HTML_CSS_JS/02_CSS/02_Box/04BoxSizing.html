<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoxSizing</title>
    <!--
        =======================================
        box-sizing 박스 크기 계산 기준
        content-box와 border-box 비교
        =======================================
    -->

    <style>
        div{
            width: 300px;
            height: 300px;
            border: 2px solid;
            /* border-box : width, height에 padding, border가 포함되어 계산된다. 기본값은 content-box */
            box-sizing: border-box;

            /* box-sizing: content-box;  : width, height가 content 영역의 크기라서 padding, border가 더해져 실제 크기가 커진다. border-box로 지정하면 padding, border를 포함해 300px이 된다 */
            padding: 30px;
        }

    </style>
</head>

<body>

    <div></div>

</body>
</html>
