<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border</title>
    <!--
        =======================================
        border 테두리
        방향별 테두리, border-radius 모서리 곡률
        =======================================
    -->

    <style>
        div {
            width: 200px;
            height: 200px;
            background-color: olivedrab;
            border: 1px solid;
        }

        /* 방향별 테두리 */
        /* border-방향 : 굵기 스타일 색상. solid 실선, dashed 파선, dotted 점선, double 이중선 */
        .d1 {
            border-top: 2px solid red;
            border-right: 3px dashed black;
            border-bottom: 4px dotted blue;
            border-left: 5px double greenyellow;
        }

        /* 크기가 0이면 border 4개가 만나는 지점이 사선으로 잘려 삼각형 모양이 된다. */
        .d2 {
            border-top: 10px solid red;
            border-right: 10px solid black;
            border-bottom: 10px solid blue;
            border-left: 10px solid greenyellow;
            width: 0px;
            height: 0px;
        }

        /* border-radius : 모서리 곡률. 값은 왼쪽 위부터 시계 방향 순서 */

        .d3{
            /* 네 모서리 동일 */
             border-radius: 50px;

            /* 왼쪽 위, 오른쪽 아래 / 오른쪽 위, 왼쪽 아래 */
            border-radius: 20px 40px;

            /* 왼쪽 위 / 오른쪽 위, 왼쪽 아래 / 오른쪽 아래 */
            border-radius: 10px 20px 30px;

            /* 왼쪽 위 / 오른쪽 위 / 오른쪽 아래 / 왼쪽 아래 */
            border-radius: 10px 20px 30px 40px;
            /* 50% : 정사각형이면 원이 된다 */
            border-radius: 50%;

        }

    </style>
</head>

<body>
    <div class="d1"></div>
    <hr>
    <div class="d2"></div>
    <hr>
    <div class="d3"></div>
</body>

</html>
