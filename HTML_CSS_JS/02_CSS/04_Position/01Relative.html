<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative</title>
    <!--
        =======================================
        position: relative
        원래 위치를 기준으로 이동하는 relative와 화면 기준 absolute 비교
        =======================================
    -->

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
        }

        div {

            width: 50px;
            height: 50px;
            border: 1px solid;
            background-color: orange;

        }

        /* relative : 원래 있던 위치(static 위치)를 기준으로 top, left 만큼 이동. 원래 자리는 비어 있는 채로 유지된다 */
        div:nth-child(1) {
            position: relative;
            left: 20px;
            top: -10px;
        }

        div:nth-child(2) {
            position: relative;
            top: 10px;
            left: 10px;
        }

        div:nth-child(3) {
            position: relative;
            /* top: calc(50vh - 25px);
            left: calc(50vW - 25px); */

        }

        /* absolute : 기준이 되는 상위 요소가 없어 화면(뷰포트)을 기준으로 위치 지정. 문서 흐름에서 빠져 나머지 요소가 자리를 채운다 */
        /* calc(50vh - 25px) : 화면 높이의 절반에서 자기 높이의 절반을 빼서 화면 가운데에 맞춘다 */
        div:nth-child(4) {
            position: absolute;
            top: calc(50vh - 25px);
            left: calc(50vW - 25px);
        }
    </style>

</head>

<body>

    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>

</body>

</html>
