<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PseudoElement</title>
    <!--
        =======================================
        가상 요소
        ::before, ::after로 요소 앞뒤에 내용 추가
        =======================================
    -->

    <style>
        /*
        가상 요소 '::' : 실제 HTML 요소는 아니지만 요소의 앞(::before)이나 뒤(::after)에 내용을 추가해 화면에 표시한다.
        content 속성이 필수이며, 개발자 도구의 Elements에는 나타나지 않는다.
        */

        div {
            width: 400px;
            height: 200px;
            border: 1px solid;
            background-color: orange;
            text-align: center;
            line-height: 200px;
        }

        /* content : 가상 요소에 표시할 내용 */
        div::before {
            content: '😎';
        }

        div::after {
            content:'✨';
        }
    </style>

</head>

<body>

    <div class="b1">
        HELLO WORLD
    </div>

</body>

</html>
