<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LayoutSelector</title>
    <!--
        =======================================
        레이아웃 선택자 구조
        자식 선택자(>)로 header, main, footer 영역별 스타일 틀을 잡는 방법
        =======================================
    -->

    <style>
        /* 선택자만 먼저 작성해 두고 영역별로 스타일을 채워 나가는 구조 */

        /* common : 공통 요소 */
        * {}

        body {}

        a {}

        ul {}

        .btn {}

        /* layout : .wrapper 바로 아래 자식 선택자로 영역을 구분 */
        .wrapper {}

        .wrapper>header>.top-header {}

        .wrapper>header>nav {}

        /* layout main */
        .wrapper>main {}

        .wrapper>main>section {}

        /* layout footer */
        .wrapper>footer {}
    </style>

</head>

<body>
    <div class="wrapper">
        <header>
            <div class="top-header"></div>
            <nav></nav>
        </header>
        <main>
            <section></section>
        </main>
        <footer></footer>
    </div>

</body>

</html>
