<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChildSelector</title>
    <!--
        =======================================
        자식, 자손 선택자
        직계 자식(>)과 모든 자손(공백)의 선택 범위 차이
        =======================================
    -->

    <style>
        /* 자식 선택자 '>' : 바로 아래 단계의 자식만 선택. 손자 이하는 선택하지 않는다 */
        .parent>div{
            border: 1px solid;
        }
        .parent>p{
            color:orange;
        }

        .parent>.child{
            border-radius: 15px;
            font-size: 1.2rem;
        }

        /* 자손 선택자 ' '(공백) : 단계와 상관없이 안에 포함된 모든 하위 요소를 선택 */
        .parent p{
            background-color: royalblue;
        }
    </style>

</head>

<body>
    <div class="parent">
        <div class="child">
            <div>1 HELLOWORLD</div>
            <div>2 HELLOWORLD</div>
            <div>3 HELLOWORLD</div>
            <p>4 HELLOWORLD</p>
        </div>
        <div>5 HELLOWORLD</div>
        <p>6 HELLOWORLD</p>
    </div>

    <hr>
    <!-- .parent 밖에 있는 .child는 위 선택자에 선택되지 않는다 -->
    <div class="child">
        <div>1 HELLOWORLD</div>
        <div>2 HELLOWORLD</div>
        <div>3 HELLOWORLD</div>
        <p>4 HELLOWORLD</p>
    </div>

</body>

</html>
