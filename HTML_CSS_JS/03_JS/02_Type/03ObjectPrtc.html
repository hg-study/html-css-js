<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ObjectPrtc</title>
    <!--
        =======================================
        객체 연습 : 점수 계산
        국어, 영어, 수학 점수를 저장하고 총점과 평균을 구하는 myScore 객체
        =======================================
    -->
</head>

<body>

    <div>
        <label>국어점수 : </label>
        <input class="korea" type="text" name="국어"><button onclick="myScore.save국어()">저장</button>
    </div>
    <div>
        <label>영어점수 : </label>
        <input class="english" type="text" name="영어"><button onclick="myScore.save영어()">저장</button>
    </div>
    <div>
        <label>수학점수 : </label>
        <input class="math" type="text" name="수학"><button onclick="myScore.save수학()">저장</button>
    </div>
    <hr />
    총점 : <div class="sum-block"></div> <button onClick="myScore.sum()">확인</button><br />
    평균 : <div class="avg-block"></div> <button onClick="myScore.avg()">확인</button><br />

    <script>

        // myScore 객체 : 점수 속성과 저장, 총점, 평균 기능을 가진다
        const myScore = {
            국어: 0,
            영어: 0,
            수학: 0,
            총점: 0,
            평균: 0,

            // querySelector : 선택자와 일치하는 첫 번째 요소를 반환. input.value는 문자열이라 Number()로 숫자로 바꿔 저장한다
            save국어: function () {
                const 국어input = document.querySelector('.korea') //적절한 selector를 확인해서 입력하세요
                console.log('국어점수 : ', 국어input.value); //국어 input 요소 안의 값을 확인
                this.국어 = Number(국어input.value); 

            },
            save영어: function () {
                const 영어input = document.querySelector('.english') //적절한 selector를 확인해서 입력하세요
                console.log('영어점수 : ', 영어input.value);//영어 input 요소안의 값을 확인
                this.영어 = Number(영어input.value); 
            },
            save수학: function () {
                const 수학input = document.querySelector('.math') //적절한 selector를 확인해서 입력하세요
                console.log('수학점수 : ', 수학input.value);//수학 input 요소안의 값을 확인
                this.수학 = Number(수학input.value); 
            },
            // 총점 확인 버튼 : 세 과목 점수를 더해 총점 속성에 저장하고 화면에 표시
            sum: function () {
                //코드추가 - 객체내 저장되어 있는 국어,영어,수학점수의 합을 '총점' 속성에 저장합니다
                this.총점 = this.국어 + this.영어 + this.수학;
                //아래코드완성 - 속성에 저장되어 있는 값을 '총점' 확인 버튼을 눌렀을때  .sum-block 안의 값으로 넣어줍니다
                const sumBlock = document.querySelector('.sum-block');
                sumBlock.innerHTML = this.총점;

            },
            // 평균 확인 버튼 : 총점을 과목 수 3으로 나눠 평균 속성에 저장하고 표시. 총점 확인을 먼저 눌러야 한다
            avg: function () {
                //코드추가 - 객체내 저장되어 있는 총점을 나눈 값을 '평균' 속성에 저장합니다(나누기연산자 :'/')
                this.평균 = this.총점 / 3;
                //아래코드완성 - 속성에 저장되어 있는 값을 '평균'을 확인 버튼을 눌렀을때  .avg-block 안의 값으로 넣어줍니다
                const avgBlock = document.querySelector('.avg-block');
                avgBlock.innerHTML = this.평균;
            }
        }
    </script>
</body>

</html>
