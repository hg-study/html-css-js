<body>

        <span style="font-size:.7rem">주문요청시 추가되는 항목들(object생성 및 저장 및 노드CRUD)</span>
        <h1>주문 확인</h1>
        <div class="items">
            <div class="item">
                <label>주문번호 : </label>
                <input type="text" name="주문번호" />
            </div>
            <div class="item">
                <label>메뉴명 : </label>

                <input type="text" name="주문번호" />
            </div>

                <input type="text" name="주문번호" />
            </div>

                <label>지불금액</label>
                <input type="text" name="주문번호" />

    <script>
        // 사전작업

        //---------------------------------------
        // step-1 - 상호명 선택하기 채우기
        //---------------------------------------

        /*
        document.querySelector(): 문서(HTML)에서 일치하는 첫 번째 요소(Element) 객체를 반환하는 자바스크립트 메소드

        */
        const selectRestaurantEl = document.querySelector('.select-restaurant');    
        const filterOptionEl = document.getElementById('filter-option');

        중구맛집_data.forEach((item) =>{
            /*
                상호명 표시
            */

            // 새노드 생성
            const optionEl = document.createElement('option');
            optionEl.innerHTML = item.BZ_NM;
            selectRestaurantEl.appendChild(optionEl);
        

        })

        // reduce로 분류(FD_CS)별 가게 수를 객체로 집계. 예) {한식: 50, 일식: 20}
        const categoryList = 
            중구맛집_data.reduce((categoryList,item) =>{
                categoryList[item.FD_CS] = (categoryList[item.FD_CS] == undefined) ? 
                1
                :categoryList[item.FD_CS] += 1;
                return categoryList;
            },{})

        // Object.entries : 객체를 [키, 값] 쌍의 배열로 바꿔 분류별 option으로 추가
        Object.entries(categoryList).forEach((item)=> {
            console.log("item",item);
            const optionEl = document.createElement('option');
            optionEl.innerHTML = `${item[0]} - ${item[1]}`;
            optionEl.value = item[0];   // 분류 필터에 쓸 value는 개수를 뺀 분류명
            filterOptionEl.appendChild(optionEl);
        })
        
        console.log("categoryList",categoryList)
        console.log(Object.entries(categoryList))

        // change : select에서 선택한 값이 바뀔 때 발생하는 이벤트
        selectRestaurantEl.addEventListener('change', (e) => {
            console.log("change event invoke!")
        })



        // step-2

        // 

        // step-3

        // 

 
    </script>
