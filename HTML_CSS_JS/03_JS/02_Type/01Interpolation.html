<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interpolation</title>
    <!--
        =======================================
        보간법(템플릿 문자열)
        백틱 안에 ${}로 변수와 식을 문자열에 삽입
        =======================================
    -->
</head>
<body>
    <!-- 
        보간법
        변수, 함수 호출 및 산술 표현식을 문자열에 직접 삽입할 수 있는 기능
        ${value} 형식을 사용, 백틱(``)에만 사용가능
    -->

    <script>
        // 변수 지정: let, 상수 지정: const
        // " ", ` `, ' ' = 문자열. 백틱은 변수 삽입이 가능하므로 백틱으로 많이 사용
        let str1 = "hello";
        let str2 = "world";
        console.log(str1+str2);

        // ${} : 백틱(`) 문자열 안에 변수, 산술식, 비교식, 함수 호출 결과를 넣는 보간 표현식
        let str3 = `TEST1: ${str1} / ${str2}`;
        let str4 = `TEST2: ${10 + 20 + 30}`;
        let str5 = `TEST3: ${10 > 20}`;
        console.log(str3);
        console.log(str4);
        console.log(str5);

    </script>
</body>
</html>
