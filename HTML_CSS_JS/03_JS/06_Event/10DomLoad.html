<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DomLoad</title>
    <!--
        =======================================
        DOMContentLoaded
        문서 로딩이 끝나면 현재 창 크기에 맞는 초기 크기를 지정하고 resize에도 반응
        =======================================
    -->
    <style>
        .ball{
            border: 1px solid gray;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            margin: auto;
            transition: .5s;
        }
        .ball-1280px{width: 500px; height: 500px; background-color: orange;}
        .ball-860px{width: 250px; height: 250px; background-color: royalblue;}
        .ball-380px{width: 70px; height: 70px; background-color: green;}
    </style>
</head>
<body>
    <div class="ball"></div>

    <script>

        

        // DOMContentLoaded : HTML 문서 구조(DOM)가 모두 만들어지면 발생. 이미지 같은 리소스 로딩은 기다리지 않는다
        window.addEventListener('DOMContentLoaded',(e) => {

            const ballEl = document.querySelector('.ball');

                // 초기 화면사이즈별 반응 처리 
                if(window.innerWidth >= 1280){
                    ballEl.classList.add('ball-1280px')
                }
                else if(window.innerWidth >= 380){
                    ballEl.classList.add('ball-860px')
    
                }else{
                    ballEl.classList.add('ball-380px')
                }


            // 반응형 처리     
            window.addEventListener('resize',(e) => {
                console.log('window.innerWidth :>> ', window.innerWidth);
                // console.log('window.outerHeight :>> ', window.outerHeight);
    
                // console.log('window.innerWidth :>> ', window.innerWidth);
                // console.log('window.innerHeight :>> ', window.innerHeight);
    
                if(window.innerWidth >= 1280){
                    ballEl.classList.remove('ball-860px','ball-380px')
                    ballEl.classList.add('ball-1280px')
                }
                else if(window.innerWidth >= 380){
                    ballEl.classList.remove('ball-1280px','ball-380px')
                    ballEl.classList.add('ball-860px')
    
                }else{
                    ballEl.classList.remove('ball-1280px','ball-860px')
                    ballEl.classList.add('ball-380px')
                }
            });


        });


    </script>
</body>
</html>
