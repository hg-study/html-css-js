<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyEvent</title>
    <!--
        =======================================
        키보드 이벤트
        keyup, keydown, keypress 비교와 Enter 입력 처리
        =======================================
    -->
</head>
<body>
    
    KEYUP: <input id = "input1"><br>
    <p id="p1"></p>
    <hr>
    KEYDOWN: <input id = "input2"><br>
    <p id="p2"></p>
    <hr>
    KEYPRESS: <input id = "input3"><br>
    <p id="p3"></p>
    <hr>

    <script>

        /*
            keyup   : 키보드가 올라갈 때 발생    (영문만. 대소문자 구별 x, 제어문자 포함 o)
            keydown : 키보드가 내려갈 때 발생    (영문만. 대소문자 구별 x, 제어문자 포함 o)
            keypress: 키보드를 계속 누를 때 발생 (영문만. 대소문자 구별 ㅇ, 제어문자 포함 x)
        */

        const keyupEl= document.querySelector('#input1');
        const p1El= document.querySelector('#p1');
        
        keyupEl.addEventListener("keyup",(e)=>{
            console.log('keyup e :>> ', e);
            console.log('keyup e.key :>> ',e.key);            // 사용자가 누른 문자열 값 반환. 대소문자 구분.
            console.log('keyup e.keyCode :>> ', e.keyCode);   // 사용자가 누른 문자열 아스키코드 숫자 반환. 대소문자 구분 x (비권장)
            
            if (e.keyCode == 13) {              // 아스키코드 13=Enter. 엔터 치면 아래에 누적되게 된다.
                const value= keyupEl.value;
                p1El.innerHTML+=value+"<br/>";
                keyupEl.value="";
            }

        });
        const keydownEl= document.querySelector('#input2');
        keydownEl.addEventListener("keydown",(e)=>{
            console.log('keydown e :>> ', e);
            console.log('keydown e.key :>> ', e.key);
            console.log('keydown e.keyCode :>> ', e.keyCode);

        });
        const keypressEl= document.querySelector('#input3');
        keypressEl.addEventListener("keypress",(e)=>{
            console.log('keypress e :>> ', e);
            console.log('keypress e.key :>> ', e.key);
            console.log('keypress e.keyCode :>> ', e.keyCode);
        });

    </script>
</body>
</html>
