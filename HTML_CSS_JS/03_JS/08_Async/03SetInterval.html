<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SetInterval</title>
    <!--
        =======================================
        setInterval
        지정한 간격으로 반복 실행하고 clearInterval로 중단
        =======================================
    -->

    <style></style>

</head>
<body>
   
    <button onclick="start()">예약실행</button>
    <button onClick="stop()">예약취소</button>
    <hr>
    <div class="d1"></div>

    <script>

        let id = null;
        let cnt = 0;
        const start = () => {
            const d1E1 = document.querySelector('.d1');

            id = setInterval(() => {  // setInterval: 일정 시간 간격마다 지정된 함수 반복 호출
                d1E1.innerHTML=`SETINTERVAL RESULT.. ${cnt++}`;
            }, 1000);
            console.log('id :>> ', id);
        }
        const stop = () => {
            clearInterval(id);  // clearInterval: setInterval()로 설정한 반복작업 중단 
        }

    </script>

</body>
</html>
