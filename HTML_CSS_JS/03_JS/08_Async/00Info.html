
<!-- 동기(Synchronous) / 비동기(ASynchronous)방식 -->

<!-- 동기 -->
코드가 위에서 아래로 순차적으로 실행
이전 작업이 끝나야 다음 작업이 실행
실행 흐름이 직관적이지만 처리시간이 오래걸리는 작업이 있으면 전체 프로그램이 지연될 수 있음

<!-- 비동기 -->
특정 작업이 끝날 때까지 기다리지 않고 다음 코드가 먼저 실행
시건이 오래 걸리는 작업(예: 네트워크 요청, 파일읽기 등)을 수행할 때 유용
콜백(callback), 프로미스(Promise), async/await등을 이용해 처리함

스레드 분할 처리- 실제로 js에서는 싱글스레드만 지원/구조적으로 스레드 분할 불가
즉, 한 번에 하나의 작업만 순차적으로 처리
