<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromiseAsync</title>
    <!--
        =======================================
        Promise와 async/await
        메인 스레드와 두 개의 비동기 작업 처리 순서를 Promise, async/await로 제어
        =======================================
    -->
    <style>
        .box {
            width: 1280px;
            height: 800px;
            border: 1px solid blue;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
        }

        .box>.main-thread {
            width: 300px;
            border: 1px solid;
            height: 100%;
        }

        .box>.sub1-thread {
            width: 300px;
            border: 1px solid;
            height: 100%;
        }

        .box>.sub2-thread {
            width: 300px;
            border: 1px solid;
            height: 100%;
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="main-thread"></div>
        <div class="sub1-thread"></div>
        <div class="sub2-thread"></div>
    </div>

    <script>
        const mainThreadEl = document.querySelector('.main-thread')
        const sub1ThreadEl = document.querySelector('.sub1-thread')
        const sub2ThreadEl = document.querySelector('.sub2-thread')
       
        // // promise 비동기 처리 객체
        // new Promise((resolve, reject) => {
        //     // 비동기 처리 로직
        //     setTimeout(() => {
        //         const isSuccess = false;
        //         if(isSuccess){
        //             resolve("작업 성공! 서버로부터 데이터 수신 완료.")
        //         }else{
        //             reject("작업 실패: 문제 상황 확인 필요.")
        //         }
        //     }, 3000); // 3초 뒤 동작
        // }).then((response) => {  // 비동기 작업 성공 시 (response)제공 값
        //     console.log('response :>> ', response);
        // })
        // .catch((error) => {    // 비동기 작업 실패 시 (reject) 제공 값
        //     console.error('error :>', error);
        // })

        let cnt = 0;
        // 메인 스레드는 멈추지 않고 1초마다 로그를 누적 출력
        setInterval(() => {
            mainThreadEl.innerHTML +=`MAIN THREAD... ${cnt++}<br>`
        },1000);

        // 비동기 기본 함수
        // Promise : 비동기 작업의 결과를 나타내는 객체. 성공하면 resolve(값), 실패하면 reject(오류)를 호출한다. then으로 성공, catch로 실패를 처리
        function sub_process_executer(val){
            return new Promise((resolve,reject)=>{
                setTimeout(() => {
                    resolve(val)
                },2000);
            });
        }

        // 비동기 함수 실행
        // sub_process_executer(11).then((response)=>{
        //     console.log('sub1-response',response);
        //     sub1ThreadEl.innerHTML+=`sub1... ${response}`;
        // }).catch((error)=>{})
        // sub_process_executer(22).then((response)=>{
        //     console.log('sub2-response',response);
        //     sub2ThreadEl.innerHTML+=`sub2... ${response}`;
        // }).catch((error)=>{})

        // Async / Await 를 이용한 비동기 처리로직 순서 배치
        // async: 함수 앞에 붙여 해당 함수가 비동기(Asynchronous) 함수임을 선언하는 키워드
        // await: async 함수 내부에서만 사용 가능. 비동기 처리(Promise)가 완료될 때까지 코드 실행을 잠시 멈추고 기다리게 만드는 키워드
        async function sub_process_order(){
            
            await sub_process_executer(22).then((response)=>{
                console.log('sub2-response',response);
                sub2ThreadEl.innerHTML+=`sub2... ${response}`;
            }).catch((error)=>{})

            await sub_process_executer(11).then((response)=>{
                console.log('sub1-response',response);
                sub1ThreadEl.innerHTML+=`sub1... ${response}`;
            }).catch((error)=>{})

        }
        sub_process_order();
    </script>
</body>

</html>
