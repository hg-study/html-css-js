<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch</title>
    <!--
        =======================================
        분기문 if
        select 값에 따라 레이아웃 class를 바꾸는 if, else if, else
        =======================================
    -->
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: beige;
        }

        .layout {
            width: 1280px;
            height: 100vh;
            margin: 0 auto;
            background-color: white;
        }

        .layout-tablet {
            width: 960px;
            height: 100vh;
            margin: 0 auto;
            background-color: white;
        }


        .layout-mobile {
            width: 350px;
            height: 100vh;
            margin: 0 auto;
            background-color: white;
        }

        .mode {
            position: fixed;
            left: 5px;
            top: 5px;
        }
    </style>
</head>

<body>

    <div>
        <select name="" id="" class="mode">
            <option value="desktop">데스크탑</option>
            <option value="tablet">태블릿</option>
            <option value="mobile">모바일</option>
        </select>
    </div>
    <div class="wrapper layout">

    </div>
    <script>
        /*
            if(조건식){
            참인 경우 실행할 종속 문장
            }
            
            else{
            거짓인 경우 실행할 종속 문장
            }
        */

        const modeEl = document.querySelector('.mode');   // CSS 선택자 .mode 만족하는 첫번째 요소 찾기
        const wrapperEl = document.querySelector('.wrapper');  // CSS 선택자 .wrapper 만족하는 첫번째 요소 찾기

        // change : select에서 선택한 값이 바뀔 때 발생하는 이벤트
        modeEl.addEventListener('change', (e)=>{
            //console.log("e:",e.target.value);  
            const mode = e.target.value; // 이벤트가 발생한 HTML 요소(target)의 현재 입력값(value)을 가져오는 코드
            if (mode == 'desktop'){
                // 데스크탑 모드
                // classList.remove / add : 요소의 class를 제거하거나 추가해 CSS 스타일을 바꾼다
                wrapperEl.classList.remove('layout-mobile','layout-tablet');
                wrapperEl.classList.add('layout');
                console.log('데스크탑 모드',wrapperEl.classList);
            }

            else if(mode == 'tablet'){
                // 태블릿 모드
                wrapperEl.classList.remove('layout-mobile','layout');
                wrapperEl.classList.add('layout-tablet');
                console.log('태블릿 모드',wrapperEl.classList);
            }
            else{    // 데스크탑이 아니라면 (모바일)
                // 모바일 모드
                wrapperEl.classList.remove('layout');
                wrapperEl.classList.add('layout-mobile','layout');              
                console.log('모바일 모드',wrapperEl.classList);
            }
        })

    </script>
</body>

</html>
