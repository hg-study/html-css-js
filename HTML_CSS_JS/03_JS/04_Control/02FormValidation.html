<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormValidation</title>
    <!--
        =======================================
        분기문 활용 : 폼 유효성 검증
        if, else if로 입력값을 차례로 검증하고 통과하면 전송
        =======================================
    -->

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
        }

        input {
            width: 100%;
            height: 40px;
            margin-bottom: 10px;
            /* border-radius: 5px; */
            border: 1px solid;
            outline: none;
            padding-left: 10px;
        }
        /* ? */
        input[type="file"]::file-selector-button{
            background-color: royalblue;
            height: 40px;
            color: white;
            outline: none;
            border: 0;
            width: 100px;
            padding-left: 0;
            padding-right: 0;
        }
        /* ?? */
        
        select {
            width: 100%;
            height: 40px;
            margin-bottom: 10px;
            /* border-radius: 5px; */
            border: 1px solid;
            outline: none;            
        }

        .btn {
            color: white;
            border: 0;
            min-height: 40px;
        }

        .btn-submit {
            width: 100%;
            background-color: royalblue;
            cursor: pointer;
        }

        .wrapper {
            max-width: 380px;
            width: 100%;

            border: 1px solid;
            margin: 0 auto;
            padding: 20px;
        }

        .wrapper>h2 {}

        .wrapper>form {
            width: 100%;
            /* border: 1px solid; */
        }


        .wrapper>form>.items {
            width: 100%;
            /* border: 1px solid; */
            margin-bottom: 10px;
        }

        .wrapper>form>.items>.item {}

        .wrapper>form>.items>.item.label {
            display: flex;
            justify-content: space-between;
        }


        .wrapper>form>.items>.item.phone {
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }
        .wrapper>form>.items>.item.phone>select {
            width: 166px;
        }

        .wrapper>form>.items>.item.birth {
            display: flex;
            justify-content: space-between;
            gap: 5px;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <h2>회원가입</h2>
        <form action="/api/join" method="get" onSubmit="submitForm(event)">

            <div class="items">

                <div class="item label">
                    <label>기본 정보</label>
                    <span>필수 사항</span>
                </div>
                <div class="item">
                    <span style ="font-size: 0.7rem;" class="message email"></span>
                    <input type="text" name= "email" placeholder="이메일" />
                </div>
                <div class="item">
                    <span style ="font-size: 0.7rem;" class="message password"></span>
                    <input type="password" name= "password" placeholder="비밀번호" />
                </div>
                <div class="item">
                    <span style ="font-size: 0.7rem;" class="message repassword"></span>
                    <input type="password" name= "repassword" placeholder="비밀번호 확인" />
                </div>

            </div>

            <div class="items">
                <div class="item label">
                    <label>닉네임</label>
                    <span>선택 사항</span>
                </div>
                <div>
                    <input placeholder="닉네임" />
                </div>
                <div class="item">
                    <input type="file" />
                </div>
            </div>

            <div class="items">
                <div class="item label">
                    <label>전화번호</label>
                    <span>선택 사항</span>
                </div>
                <div class="item phone">
                    <select>
                        <option value="">010</option>
                        <option value="">011</option>
                    </select>
                    <input placeholder="휴대폰 번호를 입력해주세요." />
                </div>
            </div>

            <div class="items">
                <div class="item label">
                    <label>생일</label>
                    <span>선택 사항</span>
                </div>
                <div class="item birth">
                    <select>
                        <option value="">1998</option>
                        <option value="">1999</option>
                    </select>
                    <select>
                        <option value="">1월</option>
                        <option value="">2월</option>
                    </select>
                    <select>
                        <option value="">1일</option>
                        <option value="">2일</option>
                    </select>
                </div>
            </div>

            <div>
                <div class="items">
                    <button class="btn btn-submit">회원가입</button>
                </div>
            </div>

        </form>

    </div>

    <script>

        // submit 이벤트 핸들러 : 입력값을 검증하고 하나라도 통과하지 못하면 return false로 전송을 막는다
        const submitForm = (e) => {
            e.preventDefault();  // 태그의 페이지 이동, 태그의 자동 새로고침(submit) 등 브라우저에 기본적으로 정의된 HTML 요소의 동작을 막는 메서드
            //console.log("call...!",e)

            const form = e.target;
            // 패스워드 확인
            // [안됨!] const regex = new RegExp("^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#.~_-])[A-Za-z\d@$!%*?&#.~_-]{8,20}$");
            const regex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#.~_-])[A-Za-z\d@$!%*?&#.~_-]{8,20}$/   // ^: 시작 $: 끝


            // 모든 유효성 message 초기화
            const messageEls = form.querySelectorAll('.message'); // 모든 message 찾기
            messageEls.forEach(message => {message.innerHTML=""});

            // 유효성 검증
            if (form.email.value == ""){
                // 이메일 미입력
                //console.log("email value undefined..");
                const messageEl = form.querySelector('.message.email');
                messageEl.innerHTML = "⚠이메일 입력은 필수사항입니다."
                console.log('messageEl', messageEl);
                return false;
            }
            else if(form.password.value == ""){
                // 패스워드 미입력
                //console.log("password value undefined..");
                const messageEl = form.querySelector('.message.password');
                messageEl.innerHTML = "⚠패스워드 입력은 필수사항입니다."
                console.log('password', messageEl);
                return false;
            }
            // regex.test(문자열) : 문자열이 정규식과 일치하면 true
            else if(!regex.test(form.password.value)){ 
                // 대소문자, 영문자, 숫자, 특수문자 중 3개 이상 포함 + 8자 이상_으로 적지 않았으면
                const messageEl = form.querySelector('.message.password');
                messageEl.innerHTML = "⚠대문자, 소문자, 숫자, 특수문자를 모두 포함해 8~20자로 입력해주세요."
                console.log('password', messageEl); 
                return false;            
            }
            else if(form.repassword.value == ""){
                // 패스워드 확인 미입력
                //console.log("repassword value undefined..");
                const messageEl = form.querySelector('.message.repassword');
                messageEl.innerHTML = "⚠패스워드를 한번 더 입력해주세요."
                console.log('repassword', messageEl);
                return false;
            }
            else if(form.password.value !== form.repassword.value){ 
                // 패스워드, 패스워드 확인 일치여부_ 일치하지 않으면
                const messageEl = form.querySelector('.message.repassword');
                messageEl.innerHTML = "⚠패스워드가 일치하지 않습니다.";
                form.repassword.value= "";
                return false;
            }

            //전송
            // 모든 검증을 통과하면 form을 전송
            form.submit();
        }

    </script>


</body>

</html>
