<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TablePrtc</title>
    <!--
        =======================================
        표 입력, 수정, 삭제 연습
        form 입력값으로 표의 행을 만들고 셀을 직접 수정하며 행을 삭제
        =======================================
    -->
    
    <!-- GOOGLE ICON -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        *{
            font-size: 1rem;
        }
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 300,
          'GRAD' 0,
          'opsz' 24;
          font-size:1.5rem;
        }
        input{
            height : 35px;
        }
        .btn{
            width : 75px;
            height : 35px;
            border-radius: 5px;
            background-color: white;
            cursor: pointer;
        }

        th,td{
            width:50px;
            height : 35px;
            border : 1px solid;
            margin : 2px;
        }
        th:nth-child(1),
        td:nth-child(1)
        {
            width : 150px;
        }
        th:nth-child(3),
        td:nth-child(3)
        {
            width : 700px;
        }

        .btn2{
            width : 75px;
            height : 35px;
            border-radius: 5px;
            background-color: white;
            cursor: pointer;
            border : 0px solid;
        }



    </style>

</head>

<body>
    <form action="" name="joinForm" onsubmit="return false">
        <input name="username" placeholder="이름을 입력하세요" >
        <input name="age"  placeholder="나이를 입력하세요">
        <input name="address" placeholder="주소를 입력하세요">
        <button class="btn">입력</button>
    </form>
    <hr>
    <table>
        <thead>
            <tr>
                <th>이름</th>
                <th>나이</th>
                <th>주소</th>
                <th>삭제</th>
            </tr>   
        </thead>

        <!-- 입력 버튼을 누르면 아래 구조의 tr이 JS로 추가된다 -->
        <tbody class="container">  
            <!--
            <tr>
                <td contenteditable="true">홍길동</td>
                <td contenteditable="true">22</td>
                <td contenteditable="true">대구 북구</td>
                <td><button class="btn2">삭제</button></td>
            </tr>
            -->
        </tbody>
        
    </table>
    <script>
        // form의 기본 기능(제출)은 form의 onsubmit="return false"로 비활성화
        const formEl = document.joinForm;           // name 속성으로 form 접근
        const btnEl = document.querySelector('.btn');
        const tableBodyEl = document.querySelector('table tbody');

        // 입력 버튼 클릭 : 유효성 검증 -> 행 생성 -> 입력창 초기화
        // 입력창에서 Enter를 눌러도 form의 기본 제출 버튼(.btn) 클릭으로 처리되므로 keydown 이벤트는 따로 등록하지 않는다
        btnEl.addEventListener('click', () => {
            if (!isValid()) return;
            createNode(formEl.username.value, formEl.age.value, formEl.address.value);
            init();
        });

        // 입력값이 비어 있으면 안내 후 false 반환
        function isValid() {
            if (formEl.username.value.trim() === '') { alert('이름을 입력해주세요.'); return false; }
            if (formEl.age.value.trim() === '') { alert('나이를 입력해주세요.'); return false; }
            if (formEl.address.value.trim() === '') { alert('주소를 입력해주세요.'); return false; }
            return true;
        }

        // 행(tr) 생성 : 이름, 나이, 주소 셀(수정 가능) + 삭제 버튼 셀
        function createNode(name, age, address) {
            const trEl = document.createElement('tr');
            [name, age, address].forEach((text) => {
                const tdEl = document.createElement('td');
                tdEl.textContent = text;
                tdEl.contentEditable = true;        // contenteditable : 셀을 클릭해 바로 수정
                trEl.appendChild(tdEl);
            });
            const delTdEl = document.createElement('td');
            const delBtnEl = document.createElement('button');
            delBtnEl.className = 'btn2';
            delBtnEl.textContent = '삭제';
            delBtnEl.addEventListener('click', () => {
                trEl.remove();                      // remove : 해당 행 삭제
            });
            delTdEl.appendChild(delBtnEl);
            trEl.appendChild(delTdEl);
            tableBodyEl.appendChild(trEl);          // appendChild : 표의 마지막 행으로 추가
        }

        // 입력창 비우기
        function init() {
            formEl.username.value = '';
            formEl.age.value = '';
            formEl.address.value = '';
            formEl.username.focus();
        }
    </script>
</body>
</html>
