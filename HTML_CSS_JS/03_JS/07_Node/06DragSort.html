<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragSort</title>
    <!--
        =======================================
        드래그로 항목 순서 변경
        항목을 드래그해 다른 항목의 위나 아래로 이동
        =======================================
    -->
    <style>

        .container .item{
            display: flex;
            justify-content: left;
            gap: 15px;
            border: 1px solid;
            margin-bottom: 5px;
            padding: 5px;
            max-width: 300px;
        }
    </style>
</head>

<body>
    <input type="text" class = "insert-value">
    &nbsp;&nbsp;
    <a href="javascript:void(0)" class="btn btn-insert">입력</a>
    <hr>
    
    <div class="container">
        <!-- <div class = "item">
            <div class="left">
                <input type="text" value="홍길동" readonly>
            </div>
            <div class="right">
                <a href="javascript:void(0)">삭제</a>
            </div>
        </div> -->
    </div>

    <script>
        const insertValueEl = document.querySelector('.insert-value');
        const btnInsertEl = document.querySelector('.btn-insert');
        const containerEl = document.querySelector('.container');
        let draggedEl = null;
        // 이벤트 처리
        insertValueEl.addEventListener("keydown",(e) => {
            if (e.keyCode == 13) {                  // 1. 엔터 키 치는지 여부

            const value = insertValueEl.value;      // 2. insertValueEl.value 값 가져오기
            if (!isValid(value))                    // 3. 유효성 검증. isValid: 유효한지 판단
                // 유효하지 않다면
                return ; // 반환
                // 유효하면 아래 실행
                createNode(value);                      // 4. 새 노드 생성 -> Container 연결
                 insertValueEl.value=''                 // 5. insertValueEl 비우기
                }
            })     
            

        btnInsertEl.addEventListener("click",(e) => {
            const value = insertValueEl.value;      // 1. insertValueEl.value 값 가져오기
            if (!isValid(value))                    // 2. 유효성 검증. isValid: 유효한지 판단
                // 유효하지 않다면
                return ; // 반환
            // 유효하면 아래 실행
            createNode(value);                      // 3. 새 노드 생성 -> Container 연결
            insertValueEl.value=''                  // 4. insertValueEl 비우기
        })        

        function isValid(value) {
            const regex = /^[^\d].*$/;

            if(value.trim() === '' || value === null){
                alert("내용을 입력하세요.");
                return false;
            }
            if(!regex.test(value)){
                alert("첫번째 오는 단어는 문자여야합니다");
                return false;
            }
            return true; 
        }

        function createNode(text) {

            // 새 노드 생성
            const itemEl = document.createElement('div');
            const leftEl = document.createElement('div');
            const inputEl = document.createElement('input');
            const rightEl = document.createElement('div');
            const aEl = document.createElement('a');

            // 클래스 추가
            itemEl.classList.add('item');
            leftEl.className='left';
            rightEl.className='right';

            // 속성 추가
            inputEl.setAttribute("readonly", true);
            aEl.setAttribute("href","javascript:void(0)");
            aEl.setAttribute("draggable",false);
            itemEl.setAttribute("draggable",true);


            // 데이터 삽입
            aEl.innerHTML='삭제';
            inputEl.value=text;

            // 이벤트 처리
            aEl.addEventListener('click',(e)=>{
                console.log(e.target.parentNode.parentNode);
                const itemEl = e.target.parentNode.parentNode;
                itemEl.remove();
            })
            // 드래그한 노드와 시작 위치(pageY)를 저장
            itemEl.addEventListener('dragstart',(e) => {
                console.log(e.target);
                console.log(e.pageY);
                //e.preventDefault();
                draggedEl = {"node": e.target, "pageY":e.pageY};
                console.log("draggedEl",draggedEl);
            })
            itemEl.addEventListener('dragover',(e) => {
                e.preventDefault();
                
            })
            itemEl.addEventListener('drop',(e) => {
                console.log(e.target);
                e.preventDefault();
            })   
            // drop : 드래그 방향에 따라 놓인 항목의 뒤(after) 또는 앞(before)으로 이동
            itemEl.addEventListener('drop',(e)=>{
                console.log(e.target);
                e.preventDefault();
                const curEl = e.target.closest('.item');     // item
                const curPageY = e.pageY;
                if(curPageY>draggedEl.pageY){  // 위-아래 드래그
                    curEl.after(draggedEl.node);
                }else{                          // 아래-위 드래그
                    curEl.before(draggedEl.node);
                }
            
            })

            // 노드 간 연결
            leftEl.appendChild(inputEl);
            rightEl.appendChild(aEl);
            itemEl.appendChild(leftEl);
            itemEl.appendChild(rightEl);
            
            // containerEl.appendChild(itemEl); // 최신이 맨 아래
            containerEl.prepend(itemEl); // 최신이 맨 위
        }

    </script>
</body>
</html>
